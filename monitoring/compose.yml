# /opt/stacks/monitoring/compose.yml
# node_exporter + smartctl_exporter — host/disk metrics for the RPi5's future Prometheus scrape.
# Both use host networking (need accurate host-level view); no bind-mount config, nothing sensitive here.

services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    environment:
      TZ: America/Denver
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:v0.14.0
    container_name: smartctl-exporter
    restart: unless-stopped
    privileged: true
    user: root
    network_mode: host
    environment:
      TZ: America/Denver
    volumes:
      - /dev:/dev:ro
